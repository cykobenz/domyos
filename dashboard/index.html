<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Domyos Woodrower</title>
<style>
  :root {
    color-scheme: dark;
    --surface-0: #111110;
    --surface-1: #1a1a19;
    --surface-2: #242423;
    --border:    #2e2e2c;
    --text-primary:   #f0efec;
    --text-secondary: #c3c2b7;
    --text-muted:     #8a897f;
    --series-power:   #3987e5;   /* slot 1 bleu */
    --series-cadence: #d95926;   /* slot 2 orange */
    --status-good:    #0ca30c;
    --status-warning: #fab219;
    --status-critical:#d03b3b;
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--surface-0);
    color: var(--text-primary);
    font-family: "Inter", "Segoe UI", system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    overflow: hidden;
    padding: 2vh 2vw;
    display: grid;
    grid-template-rows: auto auto minmax(0, 1fr) auto;    /* barre, programme, jauges, bandeau bas */
    gap: 2vh;
    cursor: none;
  }
  body.cursor { cursor: default; }

  /* ── barre d'état ── */
  header { display: flex; align-items: center; gap: 1.2vw; font-size: 2.2vh; color: var(--text-secondary); }
  header .dot { width: 1.6vh; height: 1.6vh; border-radius: 50%; background: var(--text-muted); }
  header .dot.on { background: var(--status-good); }
  header .dot.paused { background: var(--status-warning); }
  header .spacer { flex: 1; }
  header .clock { font-size: 2.6vh; color: var(--text-primary); }
  header .audio-warn { font-size: 2vh; color: #f5a623; margin-right: 2vw; }
  header .audio-warn[hidden] { display: none; }

  /* ── programme : bande (étape, cible, suivant, compte à rebours) + frise des étapes ── */
  #program {
    display: none; flex-direction: column; gap: 1.2vh; padding: 1.2vh 2vw 1.4vh;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius);
    font-size: 3vh; position: relative;
  }
  #program.show { display: flex; }
  #program .row { display: flex; align-items: baseline; gap: 1.6vw; white-space: nowrap; font-size: 2.6vh; }
  #program .row > * { flex: none; }
  #program .name { color: var(--text-secondary); font-size: 2.3vh; }
  #program .step { font-weight: 600; font-size: 3vh; }
  #program .target { color: var(--series-cadence); font-weight: 600; }
  #program .target.free { color: var(--text-muted); font-weight: 400; }
  #program .todo { display: none; color: var(--status-warning); font-weight: 700; }
  #program.mismatch .todo { display: inline; animation: pulse 1s ease-in-out infinite; }
  #program.mismatch { border-color: var(--status-warning); }
  @keyframes pulse { 50% { opacity: .35; } }
  #program .next { color: var(--text-muted); font-size: 2.2vh; }
  #program .summary { flex: 1 1 auto; min-width: 0; margin-left: auto; color: var(--text-muted); font-size: 2vh; text-align: right; overflow: hidden; text-overflow: ellipsis; }
  #program .remaining { font-size: 5vh; font-weight: 700; line-height: 1; }
  .p-segs { display: flex; gap: .35vw; height: 5.4vh; }
  .seg {
    flex: 1; min-width: 0; border-radius: 1vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 1.9vh; line-height: 1.15; overflow: hidden; white-space: nowrap;
    color: var(--text-muted); background: var(--surface-2); border: 1px solid var(--border); --c: #6b6b66;
  }
  .seg.lo { --c: var(--series-power); } .seg.hi { --c: var(--series-cadence); }
  .seg.done { background: var(--c); color: #fff; border-color: transparent; }
  .seg.cur { border: 2px solid var(--text-primary); color: #fff; font-weight: 700;
             background: linear-gradient(90deg, var(--c) var(--p, 0%), var(--surface-2) var(--p, 0%)); }
  .seg.next { background: color-mix(in srgb, var(--c) 22%, var(--surface-2)); }
  .seg small { font-size: 1.6vh; opacity: .85; font-weight: 400; }
  .seg.done.narrow small, .seg.narrow b { display: none; }

  /* ── menu programmes (touche P) ── */
  #menu {
    display: none; position: fixed; inset: 0; z-index: 20; background: rgba(17,17,16,.92);
    align-items: center; justify-content: center; flex-direction: column; gap: 2vh;
  }
  #menu.show { display: flex; }
  #menu h2 { margin: 0; font-size: 4vh; font-weight: 600; }
  #menu ul { list-style: none; margin: 0; padding: 0; width: min(70vw, 1100px); }
  #menu li {
    display: grid; grid-template-columns: 6vh 1fr auto; align-items: center; gap: 2vw;
    padding: 1.6vh 2vw; margin-bottom: 1vh; border-radius: var(--radius);
    background: var(--surface-1); border: 2px solid var(--border); font-size: 3vh; cursor: pointer;
  }
  #menu li.sel { border-color: var(--series-power); background: var(--surface-2); }
  #menu li .key { color: var(--series-power); font-weight: 700; font-size: 3.6vh; }
  #menu li .desc { display: block; color: var(--text-muted); font-size: 2.2vh; margin-top: .4vh; }
  #menu li .dur { color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  #menu .hint { color: var(--text-muted); font-size: 2.4vh; }
  #menu .stop { color: var(--status-warning); }

  /* ── jauges (arc 270°, zone cible de l'étape, valeur) ── */
  .gauges { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.5vw; min-height: 0; }
  .gauge {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 1.5vh 2vw; display: flex; flex-direction: column; align-items: center; min-height: 0; transition: opacity .4s;
  }
  .gauge .label { align-self: flex-start; font-size: 2.4vh; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .08em; }
  .gauge svg { flex: 1; min-height: 0; width: 100%; }
  .gauge .zone { font-size: 2.2vh; color: var(--text-secondary); display: flex; gap: .6em; align-items: center; min-height: 2.6vh; }
  .gauge .zone .sw { width: 1.4em; height: .45em; border-radius: .25em; background: var(--z, #4a5a6e); }
  .gauge .extra { font-size: 2vh; color: var(--text-muted); min-height: 2.4vh; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gauge .track { fill: none; stroke: var(--border); stroke-width: 22; }
  .gauge .zarc { fill: none; stroke: var(--z, #4a5a6e); stroke-width: 22; }
  .gauge .val { fill: none; stroke: var(--c); stroke-width: 22; transition: stroke-dasharray .4s; }
  .gauge .big { fill: var(--text-primary); font-size: 92px; font-weight: 600; }
  .gauge .unit, .gauge .lim { fill: var(--text-muted); font-size: 22px; }
  .gauge.dim { opacity: .35; }
  .gauge.dim .label::after { content: " · figé"; color: var(--status-warning); text-transform: none; letter-spacing: 0; }
  #g-power { --c: var(--series-power); --z: #4a5a6e; }
  #g-cad   { --c: var(--series-cadence); --z: #6e4a3a; }
  #g-pace  { --c: #9fb86b; --z: #4f5a4a; }

  /* ── bandeau bas : chiffres + courbe puissance 60 s ── */
  .strip { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)) 1.4fr; gap: 1.5vw; height: 18vh; }
  .tile {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 1.2vh 1.6vw; display: flex; flex-direction: column; justify-content: center; min-width: 0; transition: opacity .4s;
  }
  .tile .label { font-size: 1.9vh; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .08em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .value { font-size: 6.4vh; line-height: 1.05; font-weight: 600; letter-spacing: -.02em; white-space: nowrap; }
  .tile .unit  { font-size: 2.3vh; color: var(--text-muted); margin-left: .25em; font-weight: 400; }
  .tile.dim { opacity: .35; }
  .tile.dim .label::after { content: " · figé"; color: var(--status-warning); text-transform: none; letter-spacing: 0; }
  body:not(.video) #t-pace { display: none; }        /* sans vidéo, l'allure est une jauge */
  .chart {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 1vh 1.4vw; display: flex; flex-direction: column; min-height: 0; min-width: 0; position: relative;
  }
  .chart h2 { margin: 0 0 .3vh; font-size: 1.9vh; font-weight: 500; color: var(--text-secondary); display: flex; gap: .6em; align-items: center; white-space: nowrap; }
  .chart h2 .swatch { width: 1.2em; height: .35em; border-radius: 2px; }
  .chart h2 .last { margin-left: auto; color: var(--text-primary); font-size: 2.3vh; }
  .chart canvas { flex: 1; width: 100%; min-height: 0; }
  .tooltip {
    position: absolute; pointer-events: none; display: none;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
    padding: .4em .7em; font-size: 2vh; color: var(--text-primary); white-space: nowrap;
  }

  /* ── bandeau d'état plein écran ── */
  #banner {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(17,17,16,.72); backdrop-filter: blur(6px); z-index: 10; flex-direction: column; gap: 2vh;
  }
  #banner.show { display: flex; }
  #banner .big { font-size: 16vh; font-weight: 700; letter-spacing: .1em; }
  #banner .sub { font-size: 3vh; color: var(--text-secondary); }
  #banner.paused .big { color: var(--status-warning); }
  #banner.offline .big { color: var(--status-critical); font-size: 9vh; letter-spacing: .02em; }
  #banner.idle .big { color: var(--text-secondary); font-size: 9vh; letter-spacing: .02em; }

  /* ── vidéo Jellyfin (video.py) : lecteur en haut à gauche, métriques autour ── */
  #video {
    display: none; position: relative; background: #000; border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden; aspect-ratio: 16 / 9; max-height: 58vh; width: 100%;
  }
  #video video { width: 100%; height: 100%; object-fit: contain; display: block; background: #000; }
  #video .caption {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 1.4vh 2vw; font-size: 2.6vh; display: none;
    background: linear-gradient(transparent, rgba(0,0,0,.85));
  }
  #video.paused .caption, #video.err .caption { display: block; }
  #video.paused .caption::before { content: "⏸ "; }
  #video.err .caption { color: var(--status-warning); }
  body.video {
    grid-template-columns: minmax(0, 62fr) minmax(0, 38fr);
    grid-template-rows: auto auto minmax(0, 1fr) auto;
    grid-template-areas: "header header" "program program" "video gauges" "strip strip";
    column-gap: 1.5vw;
  }
  body.video header { grid-area: header; }
  body.video #program { grid-area: program; padding-bottom: 1.2vh; }
  body.video #program .remaining { font-size: 4vh; }
  body.video .p-segs { height: 3.8vh; } body.video .seg small { display: none; } body.video .seg { flex-direction: row; gap: .5vw; }
  body.video #video { display: block; grid-area: video; max-height: none; height: 100%; aspect-ratio: auto; }
  body.video .gauges { grid-area: gauges; grid-template-columns: minmax(0, 1fr); grid-template-rows: 1fr 1fr; }
  body.video #g-pace { display: none; }
  body.video .gauge {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto 1fr; column-gap: 1vw;
    grid-template-areas: "label svg" "zone svg" "extra svg"; align-items: center; padding: 1.2vh 1.6vw;
  }
  body.video .gauge .label { grid-area: label; align-self: end; } body.video .gauge .zone { grid-area: zone; } body.video .gauge .extra { grid-area: extra; align-self: start; }
  body.video .gauge svg { grid-area: svg; width: auto; height: 100%; max-height: 100%; }
  body.video .strip { grid-area: strip; grid-template-columns: repeat(6, minmax(0, 1fr)) 1.3fr; height: 16vh; }
  body.video .tile .value { font-size: 5.4vh; } body.video .tile .label { font-size: 1.7vh; }
  /* en mode vidéo, le bandeau PAUSE / PRÊT devient une pastille pour ne pas couvrir l'image */
  body.video #banner {
    inset: auto 2vw 2vh auto; backdrop-filter: none; background: var(--surface-2);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5vh 2.5vw; gap: .5vh;
  }
  body.video #banner .big { font-size: 5vh; letter-spacing: .04em; }
  body.video #banner.offline .big, body.video #banner.idle .big { font-size: 4vh; }
  body.video #banner .sub { font-size: 2.2vh; }
</style>
</head>
<body>

<header>
  <span class="dot" id="dot"></span>
  <span id="state-text">connexion au serveur…</span>
  <span id="session-text"></span>
  <span class="spacer"></span>
  <span id="resistance-text"></span>
  <span class="audio-warn" id="audio-warn" hidden>🔇 son bloqué — clique ou appuie sur B</span>
  <span class="clock" id="clock">--:--</span>
</header>

<section id="program">
  <div class="row">
    <span class="name" id="p-name"></span>
    <span class="step" id="p-step"></span>
    <span class="target" id="p-target"></span>
    <span class="todo" id="p-todo"></span>
    <span class="next" id="p-next"></span>
    <span class="summary" id="p-summary"></span>
    <span class="remaining" id="p-remaining"></span>
  </div>
  <div class="p-segs" id="p-segs"></div>
</section>

<section id="video"><video id="vid" playsinline></video><div class="caption" id="vid-caption"></div></section>

<section class="gauges">
  <div class="gauge" id="g-power">
    <div class="label">Puissance</div>
    <svg viewBox="0 0 360 300" aria-hidden="true">
      <circle class="track" cx="180" cy="170" r="120" stroke-dasharray="565.5 754" transform="rotate(135 180 170)"></circle>
      <circle class="zarc" id="gz-power" cx="180" cy="170" r="120" stroke-dasharray="0 754" transform="rotate(135 180 170)" style="display:none"></circle>
      <circle class="val" id="gv-power" cx="180" cy="170" r="120" stroke-dasharray="0 754" transform="rotate(135 180 170)"></circle>
      <text class="big" id="gt-power" x="180" y="186" text-anchor="middle">—</text>
      <text class="unit" x="180" y="224" text-anchor="middle">W</text>
      <text class="lim" id="gmin-power" x="92" y="288" text-anchor="middle">0</text>
      <text class="lim" id="gmax-power" x="268" y="288" text-anchor="middle">150</text>
    </svg>
    <div class="zone" id="z-power"></div>
    <div class="extra" id="x-power"></div>
  </div>
  <div class="gauge" id="g-cad">
    <div class="label">Cadence</div>
    <svg viewBox="0 0 360 300" aria-hidden="true">
      <circle class="track" cx="180" cy="170" r="120" stroke-dasharray="565.5 754" transform="rotate(135 180 170)"></circle>
      <circle class="zarc" id="gz-cad" cx="180" cy="170" r="120" stroke-dasharray="0 754" transform="rotate(135 180 170)" style="display:none"></circle>
      <circle class="val" id="gv-cad" cx="180" cy="170" r="120" stroke-dasharray="0 754" transform="rotate(135 180 170)"></circle>
      <text class="big" id="gt-cad" x="180" y="186" text-anchor="middle">—</text>
      <text class="unit" x="180" y="224" text-anchor="middle">coups / min</text>
      <text class="lim" id="gmin-cad" x="92" y="288" text-anchor="middle">0</text>
      <text class="lim" id="gmax-cad" x="268" y="288" text-anchor="middle">40</text>
    </svg>
    <div class="zone" id="z-cad"></div>
    <div class="extra" id="x-cad"></div>
  </div>
  <div class="gauge" id="g-pace">
    <div class="label">Allure / 500 m</div>
    <svg viewBox="0 0 360 300" aria-hidden="true">
      <circle class="track" cx="180" cy="170" r="120" stroke-dasharray="565.5 754" transform="rotate(135 180 170)"></circle>
      <circle class="zarc" id="gz-pace" cx="180" cy="170" r="120" stroke-dasharray="0 754" transform="rotate(135 180 170)" style="display:none"></circle>
      <circle class="val" id="gv-pace" cx="180" cy="170" r="120" stroke-dasharray="0 754" transform="rotate(135 180 170)"></circle>
      <text class="big" id="gt-pace" x="180" y="186" text-anchor="middle">—</text>
      <text class="unit" x="180" y="224" text-anchor="middle">min / 500 m</text>
      <text class="lim" id="gmin-pace" x="92" y="288" text-anchor="middle">4:00</text>
      <text class="lim" id="gmax-pace" x="268" y="288" text-anchor="middle">1:30</text>
    </svg>
    <div class="zone" id="z-pace"></div>
    <div class="extra" id="x-pace"></div>
  </div>
</section>

<section class="strip">
  <div class="tile"><div class="label">Temps</div><div class="value" id="v-time">00:00</div></div>
  <div class="tile"><div class="label">Distance</div><div class="value" id="v-dist">0<span class="unit">m</span></div></div>
  <div class="tile" id="t-pace"><div class="label">Allure</div><div class="value" id="v-pace">—<span class="unit">/500 m</span></div></div>
  <div class="tile"><div class="label">Coups</div><div class="value" id="v-strokes">0</div></div>
  <div class="tile"><div class="label">Calories</div><div class="value" id="v-cal">0<span class="unit">kcal</span></div></div>
  <div class="tile"><div class="label">Moyenne séance</div><div class="value" id="v-avg">—<span class="unit">W</span></div></div>
  <div class="chart" id="c-power">
    <h2><span class="swatch" style="background:var(--series-power)"></span>Puissance · 60 s<span class="last" id="l-power">—</span></h2>
    <canvas></canvas><div class="tooltip"></div>
  </div>
</section>

<div id="banner"><div class="big" id="banner-big"></div><div class="sub" id="banner-sub"></div></div>

<div id="menu">
  <h2>Programmes</h2>
  <ul id="menu-list"></ul>
  <div class="hint">chiffre ou ↑↓ + Entrée : lancer · <span class="stop">S : arrêter le programme en cours</span> · Échap : fermer</div>
</div>

<script src="vendor/hls.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const WINDOW_S = 60;
  const points = [];                 // {t, power, cad, coasting}
  let status = { connected: false, machine_state: "offline", session_id: null };
  let sessionPower = [];             // puissances vivantes de la session pour la moyenne
  let serverUp = false;
  let ws = null;
  const sendCmd = obj => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); };

  // ── helpers ────────────────────────────────────────────────────────────────
  const pad = n => String(n).padStart(2, "0");
  const fmtTime = s => s == null ? "00:00" : (s >= 3600 ? `${Math.floor(s/3600)}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}` : `${pad(Math.floor(s/60))}:${pad(s%60)}`);
  const fmtPace = p => p ? `${Math.floor(p/60)}:${pad(p%60)}` : "—";
  const setVal = (id, v, unit) => { $(id).innerHTML = unit ? `${v}<span class="unit">${unit}</span>` : v; };

  setInterval(() => { const d = new Date(); $("clock").textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`; }, 1000);

  // ── état / bandeau ─────────────────────────────────────────────────────────
  function renderStatus() {
    const dot = $("dot"), banner = $("banner");
    dot.className = "dot";
    let text, big = "", sub = "", cls = "";
    if (!serverUp)                                { text = "serveur injoignable"; cls = "offline"; big = "SERVEUR INJOIGNABLE"; sub = "server.py est-il lancé ?"; }
    else if (!status.connected)                   { text = "rameur hors ligne"; cls = "offline"; big = "RAMEUR HORS LIGNE"; sub = "Allume le rameur, la connexion est automatique"; }
    else if (status.machine_state === "paused")   { text = "pause"; dot.classList.add("paused"); cls = "paused"; big = "PAUSE"; sub = "Reprends quand tu veux"; }
    else if (status.machine_state === "idle")     { text = "prêt"; dot.classList.add("on"); cls = "idle"; big = "PRÊT"; sub = "Le premier coup de rame démarre la séance · P : choisir un programme"; }
    else                                          { text = "séance en cours"; dot.classList.add("on"); }
    $("state-text").textContent = text;
    $("session-text").textContent = status.session_id ? `· session #${status.session_id}` : "";
    banner.className = cls ? `show ${cls}` : "";
    $("banner-big").textContent = big; $("banner-sub").textContent = sub;
    updateWakeLock(serverUp && status.connected);
  }

  // ── anti-veille : Screen Wake Lock tant que le rameur est allumé ──────────
  // (server.py ajoute en plus un inhibiteur GNOME côté système, voir ScreenInhibitor)
  let wakeLock = null, wantWake = false;
  async function updateWakeLock(want) {
    wantWake = want;
    if (!("wakeLock" in navigator)) return;
    try {
      if (want && !wakeLock && document.visibilityState === "visible") {
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", () => { wakeLock = null; });
      } else if (!want && wakeLock) {
        await wakeLock.release(); wakeLock = null;
      }
    } catch (e) { wakeLock = null; /* refusé par le navigateur : l'inhibiteur système prend le relais */ }
  }
  document.addEventListener("visibilitychange", () => { if (wantWake) updateWakeLock(true); });
  window.domyosDebug = () => ({ wantWake, wakeLockHeld: !!wakeLock, audio: audio && audio.state, status,
                                video: videoState && { session: videoSession, t: vid.currentTime, paused: vid.paused, ready: vid.readyState } });   // console / tests

  // ── données ────────────────────────────────────────────────────────────────
  // ── jauges : arc de 270° (dasharray sur un cercle tourné de 135°), zone cible de l'étape ──
  const ARC = 565.5, CIRC = 754;
  const GAUGE = {
    power: { min: 0, max: 150 },
    cad:   { min: 0, max: 40 },
    pace:  { min: 240, max: 90 },          // 4:00 à gauche, 1:30 à droite (plus vite = plus loin)
  };
  // Zones cibles : puissance selon la molette demandée (R2 ≈ 41 W, R5 ≈ 51 W mesurés le 14/10,
  // la zone s'élargit avec le niveau) ; cadence et allure fixes. À affiner avec les séances.
  const powerZone = lvl => [33 + 4 * lvl - 8, 33 + 4 * lvl + 10];
  const CAD_ZONE = [20, 26], PACE_ZONE = [190, 160];
  const frac = (key, v) => Math.max(0, Math.min(1, (v - GAUGE[key].min) / (GAUGE[key].max - GAUGE[key].min)));
  function setGauge(key, value, text, zone, zoneText) {
    $("gv-" + key).setAttribute("stroke-dasharray", `${value == null ? 0 : ARC * frac(key, value)} ${CIRC}`);
    const z = $("gz-" + key);
    if (zone) {
      const a = frac(key, zone[0]), b = frac(key, zone[1]);
      z.setAttribute("stroke-dasharray", `${ARC * Math.max(0, b - a)} ${CIRC}`); z.setAttribute("stroke-dashoffset", `${-ARC * a}`); z.style.display = "";
    } else z.style.display = "none";
    $("gt-" + key).textContent = text;
    $("z-" + key).innerHTML = zoneText ? `<span class="sw"></span>${zoneText}` : "";
  }
  let lastData = null;
  function renderGauges() {
    const d = lastData || {};
    const target = program && program.resistance ? program.resistance : null;   // étape avec consigne → zones
    // échelle de puissance : s'étend par paliers de 50 W si on dépasse
    const pmax = Math.max(150, Math.ceil((d.power_w || 0) / 50) * 50);
    if (pmax !== GAUGE.power.max) { GAUGE.power.max = pmax; $("gmax-power").textContent = pmax; }
    const pz = target ? powerZone(target) : null;
    setGauge("power", d.power_w, d.power_w ? d.power_w : "—", pz, pz ? `cible R${target} : ${pz[0]} – ${pz[1]} W` : "");
    setGauge("cad", d.stroke_rate, d.stroke_rate ? d.stroke_rate.toFixed(0) : "—", target ? CAD_ZONE : null, target ? `cible : ${CAD_ZONE[0]} – ${CAD_ZONE[1]}` : "");
    setGauge("pace", d.pace_s, fmtPace(d.pace_s), target ? PACE_ZONE : null, target ? `cible : ${fmtPace(PACE_ZONE[1])} – ${fmtPace(PACE_ZONE[0])}` : "");
    const stepAvg = program && program.step_power ? program.step_power[program.step - 1] : null;
    const sessAvg = sessionPower.length ? Math.round(sessionPower.reduce((a, b) => a + b, 0) / sessionPower.length) : null;
    $("x-power").textContent = [stepAvg ? `moy. étape ${stepAvg} W` : "", sessAvg ? `séance ${sessAvg} W` : ""].filter(Boolean).join(" · ");
    $("x-cad").textContent = d.pace_s ? `allure ${fmtPace(d.pace_s)} / 500 m` : "";
    for (const id of ["g-power", "g-cad", "g-pace", "t-pace"]) $(id).classList.toggle("dim", !!d.coasting);
  }

  function onData(d) {
    lastData = d;
    setVal("v-time", fmtTime(d.elapsed_s));
    setVal("v-dist", d.distance_m ?? 0, "m");
    setVal("v-pace", fmtPace(d.pace_s), "/500 m");
    setVal("v-strokes", d.stroke_count ?? 0);
    setVal("v-cal", d.calories ?? 0, "kcal");
    $("resistance-text").textContent = d.resistance ? `résistance ${d.resistance}` : "";
    actualResistance = d.resistance ?? null;
    checkMismatch();

    if (d.session_id && !d.coasting && d.power_w > 0) sessionPower.push(d.power_w);
    if (sessionPower.length) setVal("v-avg", Math.round(sessionPower.reduce((a, b) => a + b, 0) / sessionPower.length), "W");
    renderGauges();

    const t = performance.now() / 1000;
    points.push({ t, power: d.coasting ? null : d.power_w, coasting: !!d.coasting });
    while (points.length && points[0].t < t - WINDOW_S - 1) points.shift();
    $("l-power").textContent = d.power_w && !d.coasting ? `${d.power_w} W` : "—";
    requestDraw();
  }

  // ── programme : consigne de résistance vs molette ──────────────────────────
  let program = null, lastTarget = null, actualResistance = null, doneTimer = null;
  function onProgram(m) {
    const el = $("program");
    program = m.active ? m : null;
    if (!program) {
      el.classList.remove("show", "mismatch"); lastTarget = null; checkMismatch(); renderGauges();
      if (m.finished) {                        // bandeau « terminé » 8 s + bip
        beep(2);
        $("banner").className = "show idle";
        $("banner-big").textContent = "PROGRAMME TERMINÉ"; $("banner-sub").textContent = m.name || "";
        clearTimeout(doneTimer); doneTimer = setTimeout(renderStatus, 8000);
      }
      return;
    }
    clearTimeout(doneTimer);
    el.classList.add("show");
    $("p-name").textContent = m.name;
    $("p-step").textContent = m.started ? `${m.label} · ${m.step}/${m.steps}` : `${m.label} · démarre au premier coup`;
    $("p-target").textContent = m.resistance ? `cible R${m.resistance}` : "molette libre";
    $("p-target").classList.toggle("free", !m.resistance);
    $("p-next").textContent = m.next_label ? `ensuite ${m.next_label}${m.next_resistance ? ` R${m.next_resistance}` : ""}` : "dernière étape";
    $("p-remaining").textContent = fmtTime(m.remaining_s);
    renderSegments(m);
    renderGauges();
    // bip au changement de consigne (montée / descente) ; une étape « molette libre » ne bipe pas
    if (lastTarget !== null && m.resistance && m.resistance !== lastTarget) beep(m.resistance > lastTarget ? 2 : 1);
    lastTarget = m.resistance || null;
    checkMismatch();
  }
  // Frise : un segment par étape (largeur ∝ durée, teinte = molette), faites / en cours / à venir
  function renderSegments(m) {
    const plan = m.plan || [], cur = m.step - 1, lvls = plan.map(s => s.resistance).filter(Boolean);
    const hi = lvls.length ? Math.max(...lvls) : null, lo = lvls.length ? Math.min(...lvls) : null;
    const narrow = plan.length > 16;
    $("p-segs").innerHTML = plan.map((s, i) => {
      const tone = !s.resistance ? "" : (s.resistance === hi && hi !== lo) ? "hi" : "lo";
      const state = i < cur ? "done" : i === cur ? "cur" : "next";
      const pct = i === cur && m.started ? Math.round(100 * (s.duration_s - m.remaining_s) / s.duration_s) : 0;
      const w = m.step_power && m.step_power[i];
      const main = s.resistance ? `R${s.resistance}` : (s.label.length > 10 ? "libre" : s.label);
      const sub = i < cur ? `✓${w ? ` ${w} W` : ""}` : i === cur ? (m.started ? `${w ? `${w} W` : "en cours"}` : "au 1er coup") : fmtTime(s.duration_s);
      return `<div class="seg ${state} ${tone}${narrow ? " narrow" : ""}" style="flex:${s.duration_s};--p:${pct}%" title="${s.label}"><b>${main}</b><small>${sub}</small></div>`;
    }).join("");
    const doneSteps = plan.slice(0, cur), doneT = doneSteps.reduce((a, s) => a + s.duration_s, 0);
    const doneW = (m.step_power || []).slice(0, cur).filter(Boolean);
    const restT = Math.max(0, m.total_s - m.elapsed_s - m.remaining_s), restN = plan.length - cur - 1;
    const end = new Date(Date.now() + 1000 * Math.max(0, m.total_s - m.elapsed_s));
    $("p-summary").textContent = [
      cur ? `fait ${cur} · ${fmtTime(doneT)}${doneW.length ? ` · ${Math.round(doneW.reduce((a, b) => a + b, 0) / doneW.length)} W` : ""}` : "",
      `${fmtTime(m.elapsed_s)} / ${fmtTime(m.total_s)}`,
      restN > 0 ? `reste ${restN} · ${fmtTime(restT)}` : "",
      m.started ? `fin ${pad(end.getHours())}:${pad(end.getMinutes())}` : "",
    ].filter(Boolean).join("  ·  ");
  }
  // La console notifie chaque cran de molette (Fitness Machine Status 0x07, niveau × 10) :
  // plus réactif que le champ résistance du flux de données.
  function onMachineStatus(m) {
    if (m.name === "target_resistance_changed" && m.param != null) {
      actualResistance = Math.round(m.param / 10);
      $("resistance-text").textContent = actualResistance ? `résistance ${actualResistance}` : "";
      checkMismatch();
    }
  }
  // Rappel sonore toutes les 10 s tant que la molette n'est pas sur la cible
  let mismatchTimer = null;
  function checkMismatch() {
    const bad = !!program && !!program.resistance && actualResistance != null && actualResistance !== program.resistance;
    $("program").classList.toggle("mismatch", bad);
    $("p-todo").textContent = bad ? `→ molette sur ${program.resistance}` : "";
    // rappel seulement pendant qu'on rame (pas en pause, prêt ou hors ligne)
    const rowing = () => serverUp && status.connected && status.machine_state === "running" && program && program.started;
    if (bad && !mismatchTimer) mismatchTimer = setInterval(() => { if (rowing()) beep(3, 660); }, 10000);
    if (!bad && mismatchTimer) { clearInterval(mismatchTimer); mismatchTimer = null; }
  }

  // ── menu programmes : P ouvre, chiffre / flèches + Entrée lance, S arrête, Échap ferme ──
  let menuItems = [], menuSel = 0;
  async function openMenu() {
    try {
      const r = await fetch("/api/programs"); menuItems = await r.json();
    } catch (e) { menuItems = []; }
    menuSel = 0; renderMenu(); $("menu").classList.add("show");
  }
  function closeMenu() { $("menu").classList.remove("show"); }
  function renderMenu() {
    const ul = $("menu-list"); ul.innerHTML = "";
    menuItems.slice(0, 9).forEach((p, i) => {
      const li = document.createElement("li");
      if (i === menuSel) li.classList.add("sel");
      const d = p.duration_s || 0;
      li.innerHTML = `<span class="key">${i + 1}</span><span>${p.name}<span class="desc">${p.desc || ""}</span></span>` +
                     `<span class="dur">${Math.floor(d / 60)} min${d % 60 ? ` ${pad(d % 60)} s` : ""}</span>`;
      li.onclick = () => startProgram(i);
      ul.appendChild(li);
    });
    if (!menuItems.length) ul.innerHTML = "<li><span></span><span>aucun programme (programs.json ?)</span><span></span></li>";
  }
  function startProgram(i) {
    const p = menuItems[i]; if (!p) return;
    sendCmd({ type: "program_start", preset: p.id, source: "dashboard" });
    closeMenu();
  }
  function stopProgram() { sendCmd({ type: "program_stop" }); closeMenu(); }
  const menuOpen = () => $("menu").classList.contains("show");
  // bip court (Web Audio, sans fichier) — Brave : --autoplay-policy=no-user-gesture-required
  // Sans le flag, Chromium crée l'AudioContext « suspended » jusqu'au premier geste :
  // on l'indique dans la barre (🔇) et un clic / la touche B débloque le son.
  let audio = null;
  function audioCtx() {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();
    $("audio-warn").hidden = audio.state === "running";
    audio.onstatechange = () => { $("audio-warn").hidden = audio.state === "running"; };
    return audio;
  }
  function beep(n, freq) {
    try {
      const ctx = audioCtx();
      // montée (n=2) : deux bips aigus ; descente (n=1) : un bip grave plus long
      const f = freq || (n === 1 ? 440 : 880), dur = n === 1 ? 0.45 : 0.22;
      for (let i = 0; i < n; i++) {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = "square"; o.frequency.value = f;
        const t0 = ctx.currentTime + i * 0.32;
        g.gain.setValueAtTime(0.4, t0); g.gain.exponentialRampToValueAtTime(0.01, t0 + dur);
        o.start(t0); o.stop(t0 + dur);
      }
    } catch (e) { /* audio bloqué par le navigateur : l'alerte visuelle suffit */ }
  }
  // Débloquer le son au premier geste (si le flag autoplay manque) ; B = bip de test
  window.addEventListener("click", () => audioCtx(), { once: true });
  window.addEventListener("keydown", e => {
    const k = e.key;
    if (k === "b" || k === "B") { beep(2); return; }
    if (k === "p" || k === "P") { menuOpen() ? closeMenu() : openMenu(); return; }
    if (k === "s" || k === "S") { stopProgram(); return; }
    if (!menuOpen()) return;
    if (k === "Escape") closeMenu();
    else if (k >= "1" && k <= "9") startProgram(Number(k) - 1);
    else if (k === "ArrowDown") { menuSel = Math.min(menuSel + 1, Math.min(menuItems.length, 9) - 1); renderMenu(); }
    else if (k === "ArrowUp") { menuSel = Math.max(menuSel - 1, 0); renderMenu(); }
    else if (k === "Enter") startProgram(menuSel);
    else return;
    e.preventDefault();
  });
  setTimeout(() => { try { audioCtx(); } catch (e) {} }, 1500);   // affiche 🔇 dès le chargement si bloqué

  // ── vidéo Jellyfin (hls.js) : le serveur tient l'état, le dashboard obéit et renvoie sa position ──
  const vid = $("vid");
  let hls = null, videoSession = null, videoState = null, progressTimer = null;
  const videoTitle = it => !it ? "" : it.series ? `${it.series} · S${pad(it.season || 0)}E${pad(it.episode || 0)} · ${it.name}` : it.name;
  function onVideo(m) {
    if (!m.active) {
      if (hls) { hls.destroy(); hls = null; }
      vid.pause(); vid.removeAttribute("src"); videoSession = null; videoState = null;
      clearInterval(progressTimer); progressTimer = null;
      document.body.classList.remove("video"); $("video").classList.remove("paused", "err");
      setTimeout(requestDraw, 50);
      return;
    }
    videoState = m;
    document.body.classList.add("video");
    if (m.play_session_id !== videoSession) {                 // nouveau flux (ou sous-titres changés)
      videoSession = m.play_session_id;
      $("video").classList.remove("err"); $("vid-caption").textContent = videoTitle(m.item);
      if (hls) { hls.destroy(); hls = null; }
      if (window.Hls && Hls.isSupported()) {
        hls = new Hls({ startPosition: m.position_s || -1, maxBufferLength: 60 });
        hls.on(Hls.Events.MANIFEST_PARSED, () => { if (videoState && videoState.playing) vid.play().catch(() => {}); });
        hls.on(Hls.Events.ERROR, (_, d) => {
          if (!d.fatal) return;
          if (d.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();        // Jellyfin transcode encore : on insiste
          else if (d.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
          else { $("video").classList.add("err"); $("vid-caption").textContent = `vidéo : ${d.details}`; }
        });
        hls.loadSource(m.src); hls.attachMedia(vid);
      } else {
        vid.src = m.src;                                           // navigateur avec HLS natif (Safari)
      }
      if (!progressTimer) progressTimer = setInterval(sendProgress, 3000);
    } else {
      $("vid-caption").textContent = videoTitle(m.item);
    }
    vid.volume = (m.volume ?? 100) / 100;
    if (m.playing && vid.paused) vid.play().catch(() => {});
    else if (!m.playing && !vid.paused) vid.pause();
    setTimeout(requestDraw, 50);
  }
  function onVideoCmd(m) {
    if (!videoSession) return;
    if (m.action === "seek") vid.currentTime = m.position_s;
    else if (m.action === "volume") vid.volume = m.volume / 100;
  }
  function sendProgress() {
    if (!videoSession) return;
    sendCmd({ type: "video_progress", position_s: vid.currentTime, paused: vid.paused,
              duration_s: isFinite(vid.duration) ? vid.duration : null });
  }
  vid.addEventListener("pause", () => $("video").classList.add("paused"));
  vid.addEventListener("play", () => $("video").classList.remove("paused"));
  vid.addEventListener("ended", () => { if (videoSession) sendCmd({ type: "video_ended" }); });

  function onSession(m) {
    if (m.event === "started") { sessionPower = []; setVal("v-avg", "—", "W"); }
    if (m.event === "stopped" && m.stats) {
      setVal("v-avg", m.stats.avg_power_w ? Math.round(m.stats.avg_power_w) : "—", "W");
    }
  }

  // ── graphes (Canvas2D, un axe par graphe) ──────────────────────────────────
  const charts = [
    { el: $("c-power"), key: "power", color: getComputedStyle(document.documentElement).getPropertyValue("--series-power").trim(), unit: "W", min: 0, floor: 100 },
  ];
  const css = getComputedStyle(document.documentElement);
  const C = { grid: css.getPropertyValue("--border").trim(), muted: css.getPropertyValue("--text-muted").trim(), text: css.getPropertyValue("--text-secondary").trim() };

  let drawPending = false;
  function requestDraw() { if (!drawPending) { drawPending = true; requestAnimationFrame(() => { drawPending = false; charts.forEach(draw); }); } }

  function draw(ch) {
    const canvas = ch.el.querySelector("canvas");
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return;
    if (canvas.width !== w * dpr || canvas.height !== h * dpr) { canvas.width = w * dpr; canvas.height = h * dpr; }
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    const fs = Math.max(13, Math.round(h * 0.11));          // police des axes ∝ hauteur (lisible depuis le canapé)
    const padL = fs * 3.2, padR = 14, padT = fs * 0.6, padB = fs * 1.8;
    const now = performance.now() / 1000;
    const vals = points.map(p => p[ch.key]).filter(v => v != null);
    const max = Math.max(ch.floor, ...vals) * 1.1;
    const x = t => padL + (w - padL - padR) * (1 - (now - t) / WINDOW_S);
    const y = v => padT + (h - padT - padB) * (1 - (v - ch.min) / (max - ch.min));

    // grille recessive + axe y (3 repères)
    ctx.font = `${fs}px system-ui, sans-serif`; ctx.fillStyle = C.muted; ctx.textAlign = "right"; ctx.textBaseline = "middle";
    ctx.strokeStyle = C.grid; ctx.lineWidth = 1;
    for (let i = 0; i <= 2; i++) {
      const v = ch.min + (max - ch.min) * i / 2, yy = y(v);
      ctx.beginPath(); ctx.moveTo(padL, yy); ctx.lineTo(w - padR, yy); ctx.stroke();
      ctx.fillText(Math.round(v), padL - 8, yy);
    }
    // axe x : -60 s (aligné à gauche), -30 s (centré), maintenant (aligné à droite)
    ctx.textBaseline = "top";
    ctx.textAlign = "left";   ctx.fillText("-60 s", padL + 4, h - padB + fs * 0.4);
    ctx.textAlign = "center"; ctx.fillText("-30 s", x(now - 30), h - padB + fs * 0.4);
    ctx.textAlign = "right";  ctx.fillText("maintenant", w - padR, h - padB + fs * 0.4);

    // ligne 2 px, coupée sur les trous (coasting)
    ctx.strokeStyle = ch.color; ctx.lineWidth = 2; ctx.lineJoin = "round"; ctx.lineCap = "round";
    ctx.beginPath(); let pen = false;
    for (const p of points) {
      const v = p[ch.key];
      if (v == null || p.t < now - WINDOW_S) { pen = false; continue; }
      const xx = x(p.t), yy = y(v);
      if (!pen) { ctx.moveTo(xx, yy); pen = true; } else ctx.lineTo(xx, yy);
    }
    ctx.stroke();
    // marqueur sur la dernière valeur (anneau surface 2 px)
    const last = [...points].reverse().find(p => p[ch.key] != null);
    if (last && last.t >= now - WINDOW_S) {
      ctx.beginPath(); ctx.arc(x(last.t), y(last[ch.key]), 6, 0, Math.PI * 2);
      ctx.fillStyle = css.getPropertyValue("--surface-1").trim(); ctx.fill();
      ctx.beginPath(); ctx.arc(x(last.t), y(last[ch.key]), 4, 0, Math.PI * 2);
      ctx.fillStyle = ch.color; ctx.fill();
    }
    ch._scale = { x, y, padL, padR, w, h, now };
  }

  // survol : curseur + infobulle (utile sur un écran avec souris)
  charts.forEach(ch => {
    const canvas = ch.el.querySelector("canvas"), tip = ch.el.querySelector(".tooltip");
    canvas.addEventListener("mousemove", e => {
      document.body.classList.add("cursor");
      if (!ch._scale) return;
      const r = canvas.getBoundingClientRect(), mx = e.clientX - r.left;
      const t = ch._scale.now - WINDOW_S * (1 - (mx - ch._scale.padL) / (ch._scale.w - ch._scale.padL - ch._scale.padR));
      let best = null;
      for (const p of points) if (p[ch.key] != null && (!best || Math.abs(p.t - t) < Math.abs(best.t - t))) best = p;
      if (!best) { tip.style.display = "none"; return; }
      tip.style.display = "block";
      tip.textContent = `${Math.round(best[ch.key])} ${ch.unit} · il y a ${Math.max(0, Math.round(ch._scale.now - best.t))} s`;
      tip.style.left = `${Math.min(e.clientX - r.left + 14, r.width - tip.offsetWidth - 8)}px`;
      tip.style.top = `${e.clientY - r.top - 36}px`;
    });
    canvas.addEventListener("mouseleave", () => { tip.style.display = "none"; });
  });
  window.addEventListener("resize", requestDraw);
  setInterval(requestDraw, 500);   // fait glisser la fenêtre même sans nouveau paquet

  // ── WebSocket ──────────────────────────────────────────────────────────────
  function connect() {
    ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
    ws.onopen = () => { serverUp = true; renderStatus(); };
    ws.onmessage = e => {
      const m = JSON.parse(e.data);
      if (m.type === "data") onData(m);
      else if (m.type === "status") { status = m; renderStatus(); }
      else if (m.type === "session") onSession(m);
      else if (m.type === "program") onProgram(m);
      else if (m.type === "machine_status") onMachineStatus(m);
      else if (m.type === "video") onVideo(m);
      else if (m.type === "video_cmd") onVideoCmd(m);
    };
    ws.onclose = () => { serverUp = false; renderStatus(); setTimeout(connect, 2000); };
    ws.onerror = () => ws.close();
  }
  renderStatus();
  connect();
})();
</script>
</body>
</html>
